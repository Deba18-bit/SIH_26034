[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sih-26034-backend"
version = "0.1.0"
description = "Backend for the SIH 26034 Legal Metrology compliance system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pillow>=10.0,<12.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
